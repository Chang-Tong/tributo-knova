[project]
name = "tributo-knova"
version = "0.1.0"
description = "KnoVa integration for Tributo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.42.91",
    "clickhouse-connect>=1.5,<1.6",
    "pydantic>=2.0,<3.0",
    "ray-clickhouse @ git+https://github.com/Chang-Tong/ray-clickhouse-upstream.git@c1627101736463ccc94c99c6793f91360173e6ac",
    "tributo @ git+https://github.com/Chang-Tong/Tributo.git@440da0422a3a9c5b041b6ecdbb2e40c00bf43cd90",
    "tributo-algorithms-boosting @ git+https://github.com/Chang-Tong/tributo-algorithms.git@6f39378d4d850cfd41e9510abc313efc6d4f209f#subdirectory=packages/boosting",
    "tributo-broker-redis @ git+https://github.com/Chang-Tong/tributo-broker-redis.git@e2973b2a7409fc72807bbec23388d13966c5c319",
]

[project.entry-points."tributo.brokers"]
tributo-knova = "tributo_knova.broker:KnovaBrokerPlugin"

[project.scripts]
tributo-knova = "tributo_knova.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_knova"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
override-dependencies = [
    "tributo[model-export] @ git+https://github.com/Chang-Tong/Tributo.git@440da0422a3a9c5b041b6ecdbb2e40c00bf43cd90",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
