[project]
name = "tributo-knova"
version = "0.1.0"
description = "KnoVa integration for Tributo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "clickhouse-connect>=1.5,<1.6",
    "pydantic>=2.0,<3.0",
    "tributo @ git+https://github.com/jiangxt2/Tributo.git@8cf821a22267e4972075d576eedacf3735f3d330",
    "tributo-algorithms-boosting @ git+https://github.com/jiangxt2/tributo-algorithms.git@71a6a16c3fd3676aba2225a0c528817634927fc7#subdirectory=packages/boosting",
    "tributo-broker-redis @ git+https://github.com/Chang-Tong/tributo-broker-redis.git@41a193b7b9215e332d82b67abf72315e99d18b45",
]

[project.entry-points."tributo.brokers"]
tributo-knova = "tributo_knova.broker:KnovaBrokerPlugin"

[project.entry-points."tributo.ingestion_bindings"]
tributo-knova-clickhouse = "tributo_knova.clickhouse:clickhouse_binding_descriptor"

[project.scripts]
tributo-knova = "tributo_knova.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_knova"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
